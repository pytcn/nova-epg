name: EPG

# Lädt zweimal täglich den Programmführer für alle Sender aus channels/ (8 Teile parallel), ergänzt externe Guides
# und veröffentlicht ihn über GitHub Pages:
#   https://pytcn.github.io/nova-epg/guides/dach.xml.gz   (Deutschland, Österreich, Schweiz – für NOVA+ empfohlen)
#   https://pytcn.github.io/nova-epg/guides/<land>.xml.gz  (ein Land, z. B. de, at, ch, uk, fr)
#   https://pytcn.github.io/nova-epg/guide.xml.gz          (alle Sender – groß)
on:
  schedule:
    - cron: "23 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: epg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: epg/package-lock.json
      - name: Abhängigkeiten
        working-directory: epg
        run: npm ci || npm install
      - name: Programmdaten laden (Teil ${{ matrix.shard }})
        working-directory: epg
        # Ein Teil, der nicht fertig wird oder fehlschlägt, stoppt die anderen nicht.
        continue-on-error: true
        timeout-minutes: 320
        run: mkdir -p ../out && npm run grab --- --channels=../channels/shard${{ matrix.shard }}.xml --output=../out/shard${{ matrix.shard }}.xml --days=2 --maxConnections=5
      - uses: actions/upload-artifact@v4
        with:
          name: shard${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  publish:
    needs: grab
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Externe Guides laden
        # Fertige XMLTV-Dateien Dritter; sie ergänzen nur Sender, die noch fehlen. Ausfall = kein Problem.
        run: |
          mkdir -p external
          curl -fsSL --max-time 300 -o external/epg.lat-de.xml.gz https://epg.lat/files/de.xml.gz || echo "epg.lat nicht erreichbar"
          # Für den kuratierten DACH-Guide (Pay-TV: Sky, DAZN, Eurosport, blue Sport …)
          mkdir -p dach
          for l in DE AT CH; do
            curl -fsSL --retry 2 --max-time 300 -o dach/$l.xml.gz https://epgshare01.online/epgshare01/epg_ripper_${l}1.xml.gz || echo "epgshare01 $l nicht erreichbar"
          done
          # Für den Sport-Guide und den Gesamt-Guide: UK, US-Sender und US-Team-Kanäle
          curl -fsSL --retry 2 --max-time 300 -o dach/UK.xml.gz https://epgshare01.online/epgshare01/epg_ripper_UK1.xml.gz || echo "epgshare01 UK nicht erreichbar"
          curl -fsSL --retry 2 --max-time 300 -o dach/US.xml.gz https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz || echo "epgshare01 US nicht erreichbar"
          curl -fsSL --retry 2 --max-time 300 -o dach/US_TEAMS.xml.gz https://epgshare01.online/epgshare01/epg_ripper_US_SPORTS1.xml.gz || echo "epgshare01 US-Teams nicht erreichbar"
      - name: Zusammenführen und nach Ländern aufteilen
        run: |
          python3 scripts/merge.py parts public external/*.xml.gz
          # DACH: eigener Grab + Zusatzquellen, Dubletten zusammengeführt, nur Sender mit Programm
          args="own:public/guide.xml.gz"
          for l in DE AT CH; do [ -s dach/$l.xml.gz ] && args="$args $(echo $l | tr A-Z a-z):dach/$l.xml.gz"; done
          python3 scripts/dach.py public/guides/dach.xml.gz public/guides/dach.tsv $args
          # Alles: DACH + UK + US in einer Datei, deutschsprachige Sender behalten bei gleichem Namen den Vorrang
          aargs="$args"
          [ -s dach/UK.xml.gz ] && aargs="$aargs uk:dach/UK.xml.gz"
          [ -s dach/US.xml.gz ] && aargs="$aargs us:dach/US.xml.gz"
          [ -s dach/US_TEAMS.xml.gz ] && aargs="$aargs us:dach/US_TEAMS.xml.gz"
          python3 scripts/dach.py --countries=de,at,ch,uk,us public/guides/alles.xml.gz public/guides/alles.tsv $aargs
          # Sport: deutschsprachige Sportsender + US-Sport
          sargs="dach:public/guides/dach.xml.gz"
          [ -s dach/US.xml.gz ] && sargs="$sargs us:dach/US.xml.gz"
          [ -s dach/US_TEAMS.xml.gz ] && sargs="$sargs teams:dach/US_TEAMS.xml.gz"
          python3 scripts/sport.py public/guides/sport.xml.gz public/guides/sport.tsv $sargs
          date -u > public/updated.txt
          ls -la public public/guides | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
